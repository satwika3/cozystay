version: '3.9'
services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_DATABASE: cozystay
      MYSQL_ROOT_PASSWORD: pass123
      MYSQL_USER: root
      MYSQL_PASSWORD: pass123
    ports:
      - "3306:3306"
    networks:
      - backend

  backend:
    build: .
    container_name: springboot-backend
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cozystay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: springuser
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - mysql
    networks:
      - backend

networks:
  backend:
